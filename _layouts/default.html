<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description | escape }}">
    <title>{% if page.url == '/' %}{{ site.title }}{% else %}{{ page.title | default: site.title }} · Kurtis Papple{% endif %}</title>
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="site-name" href="{{ '/' | relative_url }}">Kurtis Papple <span>Portfolio</span></a>
    </header>
    <main class="content">
      {% unless page.url == '/' %}<nav class="breadcrumb" aria-label="Breadcrumb"><a href="{{ '/' | relative_url }}">← All work</a></nav>{% endunless %}
      {{ content }}
    </main>
    <footer class="site-footer">Kurtis Papple · <a href="{{ '/' | relative_url }}">Portfolio</a></footer>
  </body>
</html>
